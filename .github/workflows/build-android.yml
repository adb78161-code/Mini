
name: Prepare MiniAI and Build APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract and arrange ZIP
        run: |
          ZIP=$(find . -maxdepth 1 -iname "*.zip" -print -quit)

          if [ -z "$ZIP" ]; then
            echo "ERROR: MiniAI ZIP not found in repository root."
            exit 1
          fi

          mkdir -p /tmp/miniai
          unzip -o "$ZIP" -d /tmp/miniai

          cp -r /tmp/miniai/MiniAI-Standalone/. .
          rm -rf /tmp/miniai
          rm -f "$ZIP"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if ! git diff --cached --quiet; then
            git commit -m "Arrange MiniAI project structure"
            git push
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Download ONNX Runtime
        run: |
          mkdir -p www/vendor

          curl -L --fail \
            https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/ort.min.js \
            -o www/vendor/ort.min.js

          curl -L --fail \
            https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/ort-wasm-simd.wasm \
            -o www/vendor/ort-wasm-simd.wasm

      - name: Install dependencies
        run: |
          npm install
          npx cap add android
          npx cap sync android

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: MiniAI-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

