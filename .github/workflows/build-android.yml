name: Build MiniAI Android

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Download ONNX Runtime
        run: |
          mkdir -p www/vendor
          curl -L --fail https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/ort.min.js -o www/vendor/ort.min.js
          curl -L --fail https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/ort-wasm-simd.wasm -o www/vendor/ort-wasm-simd.wasm

      - name: Install dependencies
        run: |
          npm install
          npx cap add android
          npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MiniAI-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
