name: Deploy MiniAI Web
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download ONNX Runtime Web assets
        run: |
          mkdir -p www/vendor
          curl -L --fail https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/ort.min.js -o www/vendor/ort.min.js
          curl -L --fail https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/ort-wasm-simd.wasm -o www/vendor/ort-wasm-simd.wasm
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www
      - id: deployment
        uses: actions/deploy-pages@v4
